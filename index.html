<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Locost</title>
    <meta name="description" content="Locost : expériences immersives, jeux et rapports entre amis." />
    <meta name="theme-color" content="#000000" />
    <script>
      // Écran de démarrage (avec mot de passe) une fois par session seulement
      document.documentElement.classList.add('js');
      try { if (sessionStorage.getItem('locost-boot')) document.documentElement.classList.add('sans-boot'); } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/locost.css" />
  </head>
  <body>
    <div class="boot" role="dialog" aria-label="Connexion">
      <canvas class="bruit boot-bruit" aria-hidden="true"></canvas>
      <div class="filigrane" style="background-image: url('/assets/images/locost-gris.png')" aria-hidden="true"></div>
      <div class="boot-console">
        <div class="boot-attente" role="status">
          <span class="roue" aria-hidden="true"></span>
          <span>chargement</span>
        </div>
        <form class="boot-acces" autocomplete="off">
          <input class="boot-mdp" id="boot-mdp" type="password" placeholder="mot de passe" aria-label="Mot de passe" autocapitalize="off" spellcheck="false" />
          <button class="boot-entrer" type="submit">Entrer</button>
          <p class="boot-erreur" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div class="fond" aria-hidden="true">
      <canvas class="bruit"></canvas>
      <div class="filigrane" style="background-image: url('/assets/images/locost-gris.png')"></div>
    </div>

    <div class="visage" aria-hidden="true" style="background-image: url('/assets/images/locost.png')"></div>

    <header class="barre">
      <span class="point">connexion</span>
      <span><span class="connectes">3</span> connectés</span>
    </header>

    <main class="wrap">
      <h1 class="glitch" data-text="Liste des apps">Liste des apps</h1>
      <p
        class="terminal"
        data-lines="Connexion établie.|Trois apps détectées.|Sélectionnez une app pour continuer."
      ></p>

      <nav class="boutons" aria-label="Apps">
        <a class="bouton" href="/jeu/">P.R.O.T.O.C.O.L.E</a>
        <a class="bouton" href="/qui-ma-troll/">Qui m'a troll ?</a>
        <span class="bouton censure" aria-label="App censurée, bientôt disponible">
          <span class="masque" aria-hidden="true">██████████</span>
        </span>
      </nav>
    </main>
    <script src="/js/bruit.js"></script>
    <script src="/js/terminal.js"></script>
    <script src="/js/boot.js"></script>
    <script src="/js/accueil.js"></script>
  </body>
</html>
