<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Locost</title>
    <meta name="description" content="Locost : expériences immersives, jeux et rapports entre amis." />
    <meta name="theme-color" content="#000000" />
    <script>
      // Écran de démarrage une fois par session seulement
      document.documentElement.classList.add('js');
      try { if (sessionStorage.getItem('locost-boot')) document.documentElement.classList.add('sans-boot'); } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/locost.css" />
  </head>
  <body>
    <div class="boot" role="dialog" aria-label="Connexion">
      <canvas class="bruit boot-bruit" aria-hidden="true"></canvas>
      <div class="filigrane" style="background-image: url('/assets/images/locost-gris.png')" aria-hidden="true"></div>
      <button class="boot-passer" type="button">passer &gt;&gt;</button>
      <div class="boot-console">
        <pre class="boot-lignes" aria-live="polite"></pre>
        <button class="boot-entrer" type="button">Entrer</button>
      </div>
    </div>

    <div class="fond" aria-hidden="true">
      <canvas class="bruit"></canvas>
      <div class="filigrane" style="background-image: url('/assets/images/locost-gris.png')"></div>
    </div>

    <div class="visage" aria-hidden="true" style="background-image: url('/assets/images/locost.png')"></div>

    <header class="barre">
      <span class="point">connexion chiffrée</span>
      <span><span class="connectes">3</span> connectés</span>
    </header>

    <main class="wrap">
      <div class="eyebrow">Accès autorisé · session anonyme</div>
      <h1 class="glitch" data-text="Choisissez votre canal">Choisissez votre canal</h1>
      <p
        class="terminal"
        data-lines="Connexion établie.|Trois canaux détectés.|Sélectionnez un canal pour continuer."
      ></p>

      <nav class="boutons" aria-label="Canaux">
        <a class="bouton" href="/jeu/">P.R.O.T.O.C.O.L.E</a>
        <a class="bouton" href="/qui-ma-troll/">Qui m'a troll ?</a>
        <span class="bouton censure" aria-label="Canal censuré, bientôt disponible">
          <span class="masque" aria-hidden="true">██████████</span>
        </span>
      </nav>
    </main>
    <script src="/js/bruit.js"></script>
    <script src="/js/terminal.js"></script>
    <script src="/js/boot.js"></script>
    <script src="/js/accueil.js"></script>
  </body>
</html>
